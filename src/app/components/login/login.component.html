<div class="login-container" dir="rtl">
    <div class="login-card">
        <h1 class="main-title">מערכת מגן - קו חם</h1>
        <p class="subtitle">מערכת ניהול ותמיכה מבוססת הרשאות</p>

        <form (ngSubmit)="onSubmit()" novalidate>
            <div class="form-group">
                <label for="login-email">כתובת אימייל</label>
                <input id="login-email" type="email" [(ngModel)]="email" name="email" autocomplete="username"
                    placeholder="הכנס את המייל שלך..." class="form-input" required />
            </div>

            <div class="form-group">
                <label for="login-password">סיסמה</label>
                <div class="password-field">
                    <input id="login-password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password"
                        name="password" autocomplete="current-password" placeholder="הכנס סיסמה..."
                        class="form-input" required />
                    <button type="button" class="toggle-visibility" (click)="togglePasswordVisibility()"
                        [attr.aria-label]="showPassword ? 'הסתר סיסמה' : 'הצג סיסמה'">
                        {{ showPassword ? '🙈' : '👁️' }}
                    </button>
                </div>
            </div>

            <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>

            <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
                {{ isSubmitting ? 'מתחבר...' : 'כניסה למערכת' }}
            </button>

            <a routerLink="/forgot-password" class="forgot-link">שכחת סיסמה?</a>
        </form>
    </div>
</div>
